<style id="css">
/* Layout: Eagle Enterprise service board — navy brand header with the store logo, gold accents, vehicle tabs, picture tiles, one card per part: size rows (left) x type columns (top) */
:root{
  --bg:#edf0f5;
  --surface:#ffffff;
  --ink:#10203d;
  --muted:#5d6a80;
  --line:#dbe1ea;
  --navy:#0d1d3b;
  --navy2:#1b3566;
  --gold:#f2b705;
  --gold2:#c98d00;
  --gold-soft:#fff4cf;
  --accent:#1b3566;
  --accent-ink:#ffffff;
  --accent-soft:#e6ecf7;
  --badge-bg:#0d1d3b;
  --badge-fg:#ffd54a;
  --price:#0d1d3b;
  --na:#a9b3c2;
  --mark:#ffe27a;
  --edit:#fff6d6;
  --edit-line:#e3c35a;
  --danger:#c23a2b;
  --ok:#1d7a46;
  --chip:#eef2f8;
  --shadow:0 1px 2px rgba(13,29,59,.06),0 4px 14px rgba(13,29,59,.06);
  --f-display:"Baloo Bhai 2","Baloo 2","Noto Sans Gujarati",system-ui,sans-serif;
  --f-body:"Noto Sans Gujarati","Noto Sans Devanagari",system-ui,sans-serif;
  --f-num:"Baloo 2","Baloo Bhai 2",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08101f;--surface:#111c33;--ink:#e8eef8;--muted:#9aa8bf;--line:#24324d;
    --accent:#ffd54a;--accent-ink:#0d1d3b;--accent-soft:#1b2a48;--badge-bg:#ffd54a;--badge-fg:#0d1d3b;
    --price:#ffffff;--na:#55637c;--mark:#5c4a0a;--edit:#2a2612;--edit-line:#7d6a24;--danger:#ff7a6b;--ok:#5fd394;
    --chip:#e4e9f1;--gold-soft:#2b2410;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08101f;--surface:#111c33;--ink:#e8eef8;--muted:#9aa8bf;--line:#24324d;
  --accent:#ffd54a;--accent-ink:#0d1d3b;--accent-soft:#1b2a48;--badge-bg:#ffd54a;--badge-fg:#0d1d3b;
  --price:#ffffff;--na:#55637c;--mark:#5c4a0a;--edit:#2a2612;--edit-line:#7d6a24;--danger:#ff7a6b;--ok:#5fd394;
  --chip:#e4e9f1;--gold-soft:#2b2410;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font-family:var(--f-body)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
body.editing .wrap{padding-block-end:120px}

/* brand header */
.top{background:linear-gradient(160deg,#0d1d3b 0%,#162d5a 70%,#1b3566 100%);color:#fff;padding-block:14px 18px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px dashed rgba(242,183,5,.12);pointer-events:none}
.top .wrap{padding-block:0;position:relative;z-index:1}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:block;height:auto;width:min(300px,62vw)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}
.title-row h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.55rem;line-height:1.05;color:#fff;text-wrap:balance}
.title-row h1 span{color:var(--gold)}
.sub{font-size:.8rem;color:#b9c6de;margin-top:3px}
.datechip{font:600 .75rem var(--f-body);color:var(--navy);background:var(--gold);padding:3px 10px;border-radius:999px;white-space:nowrap}
.lang{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:#fff;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
.ebtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:.85rem;padding:7px 12px;border-radius:999px;cursor:pointer}
.search{margin-top:14px;position:relative}
.search input{width:100%;font:500 1.05rem var(--f-body);padding:13px 44px 13px 44px;border-radius:14px;border:2px solid transparent;background:#fff;color:#10203d;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.search input::placeholder{color:#7b879b}
.search input:focus{outline:none;border-color:var(--gold)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#5d6a80}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#5d6a80;font-size:1.4rem;width:36px;height:36px;cursor:pointer;border-radius:8px}

/* vehicle tabs */
.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 6px}
.grp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 9px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700;font-size:.85rem;line-height:1.15;text-align:center;min-width:0;box-shadow:var(--shadow)}
.grp small{font-weight:400;font-size:.68rem;color:var(--muted)}
.grp[aria-pressed="true"]{background:var(--navy);border-color:var(--gold);color:#fff}
.grp[aria-pressed="true"] small{color:#c9d4ea}
.searching .grp{opacity:.55}
.ic{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:14px;background:radial-gradient(circle at 35% 30%,#ffffff,var(--chip) 70%);overflow:hidden}
.ic svg,.tile .ic svg,.grp .ic svg{width:50px;height:50px}
.ic img,.sec-icon img{width:100%;height:100%;object-fit:cover;display:block}
.grp .ic{width:54px;height:54px}
.grp[aria-pressed="true"] .ic{box-shadow:0 0 0 2px var(--gold)}

/* how to read */
.how{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 4px;font-size:.88rem;color:var(--muted)}
.how b{color:var(--ink)}
.how span{display:flex;align-items:center;gap:6px}
.how i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy);font:700 .8rem var(--f-num)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin:14px 0 22px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;text-align:center;font:700 .82rem/1.2 var(--f-body);min-width:0;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
.tile:hover,.tile:focus-visible{border-color:var(--gold);outline:none;transform:translateY(-2px)}
.tile:active{transform:scale(.97)}
.tile span{overflow-wrap:anywhere}

/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 16px 16px;margin-bottom:16px;scroll-margin-top:12px;box-shadow:var(--shadow);overflow:hidden}
.sec-head{display:flex;align-items:center;gap:14px;margin:0 -16px 14px;padding:12px 16px;background:linear-gradient(90deg,var(--gold-soft),transparent 80%);border-bottom:1px solid var(--line)}
.sec-icon{flex:none;width:76px;height:76px;border-radius:16px;background:radial-gradient(circle at 35% 30%,#ffffff,var(--chip) 70%);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(242,183,5,.35)}
.sec-icon svg{width:64px;height:64px}
.sec-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.1}
.gtag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--navy);background:var(--gold);padding:1px 8px;border-radius:999px;margin-bottom:3px}
.alt{font-size:.85rem;color:var(--muted);margin-top:2px}
.blk+.blk{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.sub-h{font:700 1.02rem var(--f-display);margin:0 0 8px;display:flex;flex-direction:column}
.sub-h::before{content:"";width:28px;height:3px;border-radius:2px;background:var(--gold);margin-bottom:6px}
.sub-h small{display:block;font:400 .8rem var(--f-body);color:var(--muted)}

/* table */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;text-align:center;vertical-align:middle}
thead th{font:700 .9rem/1.2 var(--f-body);border-bottom:2px solid var(--navy2)}
thead th small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);margin-top:2px}
thead th:first-child{text-align:left;color:var(--muted);font-weight:600;font-size:.78rem}
tbody td{border-bottom:1px solid var(--line)}
tbody tr:nth-child(even) td{background:rgba(127,140,165,.06)}
tbody tr:last-child td{border-bottom:0}
td.size{text-align:left;white-space:nowrap}
.sz{display:inline-block;background:var(--badge-bg);color:var(--badge-fg);font:700 1.05rem/1 var(--f-num);padding:6px 9px 5px;border-radius:9px;margin:2px 4px 2px 0;min-width:44px;text-align:center}
.sz-group{display:flex;flex-wrap:wrap;max-width:200px}
.pr{font:800 1.45rem/1 var(--f-num);color:var(--price);white-space:nowrap}
.pr .r{font-size:.95rem;font-weight:700;margin-right:1px;color:var(--gold2)}
.pr .sl{font-weight:500;color:var(--muted);margin:0 2px}
.na{color:var(--na);font:600 .8rem var(--f-body)}
.na::before{content:"—";display:block;font:700 1.2rem/1 var(--f-num)}
tr.hit td{background:var(--mark)!important}

/* price picks (no size) */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pick{border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}
.pick .lb{font:600 .92rem/1.2 var(--f-body)}
.pick .lb small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);margin-top:2px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .lb{font:600 .98rem/1.25 var(--f-body);min-width:0}
.li .lb small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.unit{font:600 .78rem var(--f-body);color:var(--muted);margin-left:4px}

/* edit mode */
.editing .sec{border-color:var(--edit-line)}
.tri{display:flex;flex-direction:column;gap:3px;min-width:0}
.tri input,.ein{font:500 .95rem var(--f-body);color:var(--ink);background:var(--edit);border:1px solid var(--edit-line);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.tri input.t-gu{font-weight:700}
.tri input.t-hi,.tri input.t-en{font-size:.78rem;padding:4px 8px}
.sec-head .tri input.t-gu{font:800 1.2rem var(--f-display)}
.ein.pin{font:700 1.1rem var(--f-num);text-align:center;min-width:70px}
.ein.szin{font:700 1rem var(--f-num);width:72px}
select.ein{width:auto}
.ed-row{display:flex;gap:8px;align-items:center}
.ed-row>.tri{flex:1}
.x{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--danger);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.1rem;line-height:1}
.x.armed{width:auto;padding:0 10px;font-size:.8rem;font-weight:700;border-color:var(--danger)}
.add{border:1px dashed var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:.88rem;padding:7px 12px;border-radius:10px;cursor:pointer}
.adds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.etable th,.etable td{padding:4px 3px;vertical-align:top}
.etable thead th{border-bottom:1px solid var(--line)}
.col-ed{display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:110px}
.col-ed .x{align-self:center}
.epick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.epick .pick{gap:6px}
.eli{display:grid;grid-template-columns:minmax(0,1fr) 90px auto 32px;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.blk-tools{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.blk-tools .tri{flex:1}
.hint{font-size:.75rem;color:var(--muted)}
.newcat{width:100%;padding:14px;font-size:1rem}
.ebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--edit-line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.ebar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ebar .msg{flex:1;min-width:150px;font-size:.88rem}
.ebar .msg.err{color:var(--danger);font-weight:600}
.ebar .msg.ok{color:var(--ok);font-weight:600}
.ebar button{font-weight:700;font-size:.95rem;padding:10px 16px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.ebar button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.ebar button:disabled{opacity:.5;cursor:default}

.pinbox{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.55);display:grid;place-items:center;padding:16px}
.pincard{background:var(--surface);color:var(--ink);border-radius:18px;padding:22px 20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:4px solid var(--gold)}
.pincard h3{margin:0;font:800 1.25rem var(--f-display)}
.pincard p{margin:0;font-size:.85rem;color:var(--muted)}
.pincard input{font:800 2rem var(--f-num);letter-spacing:.5em;text-align:center;padding:10px 8px 10px 20px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.pincard input:focus{outline:none;border-color:var(--gold)}
.pincard .err{color:var(--danger);font-weight:600;font-size:.88rem;min-height:1.2em}
.pincard .row{display:flex;gap:10px}
.pincard .row button{flex:1;font-weight:700;font-size:1rem;padding:12px;border-radius:12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pincard .row button.primary{background:var(--navy);border-color:var(--navy);color:#fff}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center;color:var(--muted)}
.foot{margin-top:24px;font-size:.8rem;color:var(--muted);text-align:center}
.foot b{display:block;color:var(--ink);font-family:var(--f-display);font-size:.95rem;margin-bottom:2px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:560px){
  .groups{display:flex;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
  .grp{flex:0 0 98px}
}
@media (max-width:480px){
  .title-row h1{font-size:1.3rem}
  .pr{font-size:1.25rem}
  .sec{padding:0 12px 14px}
  .sec-head{margin:0 -12px 12px;padding:10px 12px}
  .sz{font-size:.95rem;min-width:40px;padding:5px 7px 4px}
  .sz-group{max-width:120px}
  .eli{grid-template-columns:minmax(0,1fr) 80px 32px}
  .eli select{grid-column:1/2}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=o=>o?(o[lang]||o.gu||o.en||o.hi||""):"";
const alt=o=>{if(!o)return"";const p=nm(o);const seen=new Set([p]);return LANGS.filter(k=>k!==lang).map(k=>o[k]).filter(v=>v&&!seen.has(v)&&seen.add(v)).map(esc).join(" · ");};
const fmt=x=>{const t=String(x).trim();return /^\d+$/.test(t)?Number(t).toLocaleString("en-IN"):esc(t);};
const price=v=>{const t=String(v==null?"":v).trim();if(!t)return`<span class="na">${UI[lang].na}</span>`;
  return`<span class="pr"><span class="r">₹</span>${t.split("/").map(fmt).join('<span class="sl">/</span>')}</span>`;};
const norm=s=>String(s==null?"":s).toLowerCase().replace(/["″”']/g,"").trim();
const isSize=q=>/^\d+(\.\d+)?c?$/i.test(q);
const J=a=>esc(JSON.stringify(a));
const getAt=(o,p)=>p.reduce((a,k)=>a[k],o);
function setAt(o,p,v){const last=p[p.length-1];const par=getAt(o,p.slice(0,-1));par[last]=v;}
const blank=()=>({gu:"",hi:"",en:""});
function hay(c){const parts=[c.n.gu,c.n.hi,c.n.en,c.kw||""];
  c.blocks.forEach(b=>{if(b.t)parts.push(b.t.gu,b.t.hi,b.t.en);(b.cols||[]).forEach(x=>parts.push(x.gu,x.hi,x.en));(b.items||[]).forEach(i=>parts.push(i.n.gu,i.n.hi,i.n.en));});
  return norm(parts.join(" "));}
function group(rows){const out=[];rows.forEach(r=>{const l=out[out.length-1];if(l&&JSON.stringify(l.p)===JSON.stringify(r.p))l.s.push(r.s);else out.push({s:[r.s],p:r.p});});return out;}
function dmy(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");return m?`${m[3]}-${m[2]}-${m[1]}`:"";}

/* ---------- view blocks ---------- */
function viewBlock(b,q){
  let h=`<div class="blk">`;
  if(b.t&&nm(b.t)) h+=`<div class="sub-h">${esc(nm(b.t))}<small>${alt(b.t)}</small></div>`;
  if(b.k==="table"){
    h+=`<div class="tbl-wrap"><table><thead><tr><th>${UI[lang].size}</th>${b.cols.map(c=>`<th>${esc(nm(c))}<small>${alt(c)}</small></th>`).join("")}</tr></thead><tbody>`;
    group(b.rows).forEach(r=>{
      const hit=q&&isSize(q)&&r.s.some(s=>norm(s)===q);
      h+=`<tr${hit?' class="hit"':""}><td class="size"><div class="sz-group">${r.s.map(s=>`<span class="sz">${esc(String(s).replace(/"/g,"″"))}</span>`).join("")}</div></td>${r.p.map(v=>`<td>${price(v)}</td>`).join("")}</tr>`;
    });
    h+=`</tbody></table></div>`;
  }else if(b.k==="pick"){
    h+=`<div class="picks">${b.cols.map((c,i)=>`<div class="pick"><div class="lb">${esc(nm(c))}<small>${alt(c)}</small></div>${price(b.p[i])}</div>`).join("")}</div>`;
  }else if(b.k==="list"){
    h+=`<div class="list">${b.items.map(it=>`<div class="li"><div class="lb">${esc(nm(it.n))}<small>${alt(it.n)}</small></div><div style="white-space:nowrap">${price(it.p)}${it.u&&UNITS[it.u]?`<span class="unit">/ ${esc(UNITS[it.u][lang])}</span>`:""}</div></div>`).join("")}</div>`;
  }
  return h+`</div>`;
}

/* ---------- edit blocks ---------- */
const tri=(p,o,ph)=>`<div class="tri"><input class="t-gu" data-k="${J(p.concat("gu"))}" value="${esc(o.gu)}" placeholder="${ph||"ગુજરાતી નામ"}"><input class="t-hi" data-k="${J(p.concat("hi"))}" value="${esc(o.hi)}" placeholder="हिंदी नाम"><input class="t-en" data-k="${J(p.concat("en"))}" value="${esc(o.en)}" placeholder="English name"></div>`;
const pin=(p,v)=>`<input class="ein pin" data-k="${J(p)}" value="${esc(v)}" placeholder="—" inputmode="text" autocomplete="off">`;
const xb=(act,p,i,label)=>`<button type="button" class="x" data-act="${act}" data-k="${J(p)}"${i!=null?` data-i="${i}"`:""} aria-label="${label||"કાઢી નાખો"}" title="${label||"કાઢી નાખો"}">×</button>`;
function editBlock(b,bp){
  let h=`<div class="blk"><div class="blk-tools">${tri(bp.concat("t"),b.t||blank(),"મથાળું (ખાલી રાખી શકાય)")}${xb("delBlock",bp,null,"આ ભાગ કાઢો")}</div>`;
  if(b.k==="table"){
    h+=`<div class="tbl-wrap"><table class="etable"><thead><tr><th>સાઈઝ</th>${b.cols.map((c,i)=>`<th><div class="col-ed">${tri(bp.concat("cols",i),c)}${xb("delCol",bp,i,"આ પ્રકાર કાઢો")}</div></th>`).join("")}<th></th></tr></thead><tbody>`;
    b.rows.forEach((r,ri)=>{
      h+=`<tr><td><input class="ein szin" data-k="${J(bp.concat("rows",ri,"s"))}" value="${esc(r.s)}" placeholder='20"'></td>${r.p.map((v,pi)=>`<td>${pin(bp.concat("rows",ri,"p",pi),v)}</td>`).join("")}<td>${xb("delRow",bp,ri,"આ સાઈઝ કાઢો")}</td></tr>`;
    });
    h+=`</tbody></table></div><div class="adds"><button type="button" class="add" data-act="addRow" data-k="${J(bp)}">+ નવી સાઈઝ</button><button type="button" class="add" data-act="addCol" data-k="${J(bp)}">+ નવો પ્રકાર (કોલમ)</button></div>`;
  }else if(b.k==="pick"){
    h+=`<div class="epick">${b.cols.map((c,i)=>`<div class="pick">${tri(bp.concat("cols",i),c)}<div class="ed-row">${pin(bp.concat("p",i),b.p[i])}${xb("delCol",bp,i,"આ પ્રકાર કાઢો")}</div></div>`).join("")}</div>
      <div class="adds"><button type="button" class="add" data-act="addCol" data-k="${J(bp)}">+ નવો પ્રકાર</button></div>`;
  }else if(b.k==="list"){
    h+=b.items.map((it,ii)=>`<div class="eli">${tri(bp.concat("items",ii,"n"),it.n)}${pin(bp.concat("items",ii,"p"),it.p)}
      <select class="ein" data-k="${J(bp.concat("items",ii,"u"))}" aria-label="એકમ"><option value="">—</option>${Object.keys(UNITS).map(k=>`<option value="${k}"${it.u===k?" selected":""}>/ ${UNITS[k].gu}</option>`).join("")}</select>
      ${xb("delItem",bp,ii,"આ વસ્તુ કાઢો")}</div>`).join("");
    h+=`<div class="adds"><button type="button" class="add" data-act="addItem" data-k="${J(bp)}">+ નવી વસ્તુ</button></div>`;
  }
  return h+`</div>`;
}

  {const w=u.t.split(" ");const last=w.pop();$("ttl").innerHTML=esc(w.join(" "))+" <span>"+esc(last)+"</span>";}

/* ---------- edit actions ---------- */
function msg(t,cls){const m=$("emsg");m.textContent=t;m.className="msg"+(cls?" "+cls:"");}
function markDirty(){dirty=true;msg("ફેરફાર થયો છે. સેવ કરવાનું ભૂલશો નહીં.");}
const ACT={
  addRow(p){const b=getAt(W,p);b.rows.push({s:"",p:b.cols.map(()=>"")});},
  delRow(p,i){getAt(W,p).rows.splice(i,1);},
  addCol(p){const b=getAt(W,p);b.cols.push(blank());if(b.k==="table")b.rows.forEach(r=>r.p.push(""));else b.p.push("");},
  delCol(p,i){const b=getAt(W,p);b.cols.splice(i,1);if(b.k==="table")b.rows.forEach(r=>r.p.splice(i,1));else b.p.splice(i,1);},
  addItem(p){getAt(W,p).items.push({n:blank(),p:""});},
  delItem(p,i){getAt(W,p).items.splice(i,1);},
  addBlock(p,i,kind){const c=getAt(W,p);c.blocks.push(kind==="table"?{k:"table",cols:[blank()],rows:[{s:"",p:[""]}]}:kind==="pick"?{k:"pick",cols:[blank()],p:[""]}:{k:"list",items:[{n:blank(),p:""}]});},
  delBlock(p){const i=p[p.length-1];getAt(W,p.slice(0,-1)).splice(i,1);},
  addCat(p){const id="p"+Date.now().toString(36);getAt(W,p).push({id,ic:"box",n:blank(),kw:"",blocks:[{k:"list",items:[{n:blank(),p:""}]}]});return id;},
  delImg(p){delete getAt(W,p).img;},
  delCat(p){const i=p[p.length-1];getAt(W,p.slice(0,-1)).splice(i,1);},
};
const DANGER={delCat:1,delBlock:1};
function onClick(e){
  const lb=e.target.closest(".lang button");
  if(lb){lang=lb.dataset.l;store.set("bhav-lang",lang);render();return;}
  const gb=e.target.closest(".grp");
  if(gb){grp=gb.dataset.g;store.set("bhav-grp",grp);$("q").value="";render();window.scrollTo({top:0});return;}
  const ab=e.target.closest("[data-act]");
  if(ab&&edit){
    const act=ab.dataset.act;
    if(act==="pickImg"){pickPhoto(JSON.parse(ab.dataset.k));return;}
    if(DANGER[act]&&!ab.classList.contains("armed")){
      ab.classList.add("armed");ab.textContent="ખાતરી? ફરી દબાવો";
      setTimeout(()=>{if(ab.isConnected){ab.classList.remove("armed");ab.textContent="×";}},4000);return;
    }
    const newId=ACT[act](JSON.parse(ab.dataset.k),ab.dataset.i!=null?Number(ab.dataset.i):null,ab.dataset.kind);
    markDirty();render();
    if(act==="addCat"&&newId){const el=$(newId);if(el){el.scrollIntoView({block:"start"});const f=el.querySelector("input");if(f)f.focus({preventScroll:true});}}
  }
}
function pickPhoto(p){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.hidden=true;document.body.appendChild(inp);
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0];inp.remove();if(!f)return;
    const url=URL.createObjectURL(f);const im=new Image();
    im.onload=()=>{
      const M=360,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));
      const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(im.naturalWidth*k));cv.height=Math.max(1,Math.round(im.naturalHeight*k));
      const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);getAt(W,p).img=cv.toDataURL("image/jpeg",0.78);markDirty();render();
    };
    im.onerror=()=>{URL.revokeObjectURL(url);msg("આ ફોટો ખૂલ્યો નહીં. બીજો ફોટો પસંદ કરો.","err");};
    im.src=url;
  });
  inp.click();
}
function onInput(e){
  const t=e.target;
  if(t.id==="q"){render();return;}
  if(edit&&t.dataset&&t.dataset.k){setAt(W,JSON.parse(t.dataset.k),t.value);markDirty();}
}
/* ---------- PIN lock ---------- */
function pinHash(pin){let h=0x811c9dc5>>>0;const t="eagle-bhav|"+pin;for(let r=0;r<400;r++)for(let i=0;i<t.length;i++){h^=(t.charCodeAt(i)+r)&0xffff;h=Math.imul(h,16777619)>>>0;}return "f1-"+h.toString(16);}
let pinFails=0,pinLockUntil=0;
function askPin(title,note,check){
  return new Promise(resolve=>{
    const box=document.createElement("div");box.className="pinbox";
    box.innerHTML=`<form class="pincard" autocomplete="off"><h3>${esc(title)}</h3>${note?`<p>${esc(note)}</p>`:""}
      <input id="pinin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="PIN">
      <div class="err" id="pinerr"></div>
      <div class="row"><button type="button" id="pinno">રદ કરો</button><button type="submit" class="primary">આગળ</button></div></form>`;
    document.body.appendChild(box);
    const inp=box.querySelector("#pinin"),er=box.querySelector("#pinerr");
    setTimeout(()=>inp.focus(),30);
    inp.addEventListener("input",()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,6);er.textContent="";});
    const done=v=>{box.remove();resolve(v);};
    box.querySelector("#pinno").addEventListener("click",()=>done(null));
    box.querySelector("form").addEventListener("submit",e=>{
      e.preventDefault();
      const now=Date.now();
      if(now<pinLockUntil){er.textContent=`ઘણી વાર ખોટો PIN. ${Math.ceil((pinLockUntil-now)/1000)} સેકન્ડ પછી ફરી નાખો.`;return;}
      const v=inp.value;
      if(v.length<4){er.textContent="ઓછામાં ઓછા 4 આંકડા નાખો.";return;}
      const bad=check?check(v):null;
      if(bad){er.textContent=bad;inp.value="";inp.focus();return;}
      done(v);
    });
  });
}
function wrongPin(){pinFails++;if(pinFails>=5){pinFails=0;pinLockUntil=Date.now()+30000;return "5 વાર ખોટો PIN. 30 સેકન્ડ રાહ જુઓ.";}return "PIN ખોટો છે. ફરી નાખો.";}
const checkAgainst=hash=>v=>{if(Date.now()<pinLockUntil)return "થોડી વાર રાહ જુઓ.";if(pinHash(v)!==hash)return wrongPin();pinFails=0;return null;};
async function newPin(){
  const a=await askPin("નવો PIN બનાવો","4 થી 6 આંકડા. આ PIN વગર કોઈ ભાવ બદલી કે સેવ નહીં કરી શકે.");
  if(a==null) return null;
  const b=await askPin("ફરી એ જ PIN નાખો","ખાતરી માટે",v=>v===a?null:"બંને PIN સરખા નથી. ફરી નાખો.");
  if(b==null) return null;
  return pinHash(a);
}
async function startEdit(){
  if(DATA.pinHash){
    const ok=await askPin("ભાવ બદલવા PIN નાખો",null,checkAgainst(DATA.pinHash));
    if(ok==null) return;
    W=JSON.parse(JSON.stringify(DATA));edit=true;dirty=false;$("q").value="";render();msg('✏️ ભાવ બદલો, પછી "સેવ કરો" દબાવો.');
  }else{
    const h=await newPin();
    if(!h) return;
    W=JSON.parse(JSON.stringify(DATA));W.pinHash=h;edit=true;dirty=true;$("q").value="";render();
    msg('🔒 PIN બન્યો. હવે "સેવ કરો" દબાવશો ત્યારે PIN પાકો થશે.');
  }
}
async function changePin(){
  if(!edit) return;
  const h=await newPin();
  if(!h) return;
  W.pinHash=h;markDirty();msg('🔒 નવો PIN સેવ કરવા "સેવ કરો" દબાવો.');
}
function stopEdit(){edit=false;W=null;dirty=false;render();}
function cleaned(d){
  const out=JSON.parse(JSON.stringify(d));
  const tr=o=>{if(o&&typeof o==="object")for(const k in o){if(typeof o[k]==="string")o[k]=o[k].trim();else tr(o[k]);}};
  tr(out);
  out.groups.forEach(g=>{g.cats.forEach(c=>{
    c.blocks.forEach(b=>{
      if(b.t&&!b.t.gu&&!b.t.hi&&!b.t.en) delete b.t;
      if(b.k==="table") b.rows=b.rows.filter(r=>r.s||r.p.some(Boolean));
      if(b.k==="list") b.items=b.items.filter(it=>it.n.gu||it.n.hi||it.n.en||it.p).map(it=>{if(!it.u)delete it.u;return it;});
    });
    if(!c.n.gu&&!c.n.hi&&!c.n.en) c.n.gu="નવો પાર્ટ";
  });});
  const t=new Date();out.updated=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  return out;
}
function buildPage(d){
  const css=$("css").textContent, app=$("app").textContent;
  const json=JSON.stringify(d).replace(/</g,"\\u003c");
  return SKEL+HEAD+'<style id="css">'+css+'</style>\n<div id="root"></div>\n<script id="pl-data" type="application/json">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n</body></html>';
}
async function save(){
  if(busy||!art) return;
  if(!dirty){msg("કોઈ ફેરફાર નથી.");return;}
  if(W.pinHash){const ok=await askPin("સેવ કરવા PIN નાખો",null,checkAgainst(W.pinHash));if(ok==null)return;}
  busy=true;$("esave").disabled=true;msg("સેવ થાય છે…");
  try{
    await art.publish(buildPage(cleaned(W)));
    dirty=false;msg("✓ સેવ થઈ ગયું. બધાને નવો ભાવ દેખાશે.","ok");
  }catch(err){
    const c=err&&err.code;
    if(c==="conflict") msg("બીજી જગ્યાએથી હમણાં જ ફેરફાર સેવ થયો. પેજ ફરી ખુલશે, પછી ફરી બદલો.","err");
    else if(c==="not_writer"||c==="not_granted"){msg("તમને ભાવ બદલવાની મંજૂરી નથી. આ પેજ ફક્ત જોવા માટે છે.","err");art=null;}
    else if(c==="too_large") msg("ફોટા બહુ વધારે થઈ ગયા. થોડા ફોટા કાઢીને ફરી સેવ કરો.","err");
    else if(c==="rate_limited") msg("થોડી વાર પછી ફરી સેવ કરો.","err");
    else msg("સેવ ન થયું. થોડી વાર પછી ફરી દબાવો.","err");
  }finally{busy=false;$("esave").disabled=false;}
}

/* ---------- boot ---------- */
shell();render();
document.addEventListener("click",onClick);
document.addEventListener("input",onInput);
document.addEventListener("change",e=>{if(e.target.tagName==="SELECT")onInput(e);});
$("clr").addEventListener("click",()=>{$("q").value="";render();$("q").focus();});
$("ebtn").addEventListener("click",startEdit);
$("ecancel").addEventListener("click",e=>{
  const b=e.currentTarget;
  if(dirty&&!b.dataset.armed){b.dataset.armed="1";b.textContent="ફેરફાર જશે, ફરી દબાવો";setTimeout(()=>{delete b.dataset.armed;b.textContent="રદ કરો";},4000);return;}
  delete b.dataset.armed;b.textContent="રદ કરો";stopEdit();
});
$("esave").addEventListener("click",save);
$("epin").addEventListener("click",changePin);
if(h0){const el=$(h0);if(el)setTimeout(()=>el.scrollIntoView({block:"start"}),50);}

/* owner / editors get the edit button; everyone else only reads */
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const a=await window.claude.use("artifact");
    if(!a) return;
    const u=await window.claude.use("user");
    const ok=u?await u.canEdit():true;
    if(ok){art=a;render();}
  }catch(e){}
})();
})();
